name: nyumba_mtaani
description: "A Real-Estate and house hunting app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^12.1.3
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.0.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  image_picker: ^1.0.7
  path: ^1.9.0
  geolocator: ^13.0.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/ic_nyumba.png"
  min_sdk_android: 21 # android min sdk value
  web:
    generate: true
    image_path: "assets/images/ic_nyumba.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/ic_nyumba.png"
    icon_size: 48 # min sizes for windows
  macos:
    generate: true
    image_path: "assets/images/ic_nyumba.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/
